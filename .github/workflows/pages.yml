name: Publish Atlas to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-pages
  cancel-in-progress: true
jobs:
  build:
    if: ${{ vars.VITE_API_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm test
      - name: Build Pages site
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/baby-welcome/' }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Set the VITE_API_URL repository variable to your HTTPS backend URL, ending in /api."
            exit 1
          fi
          node -e "const url = new URL(process.env.VITE_API_URL); if (url.protocol !== 'https:' || !url.pathname.replace(/\/$/, '').endsWith('/api')) process.exit(1)"
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4